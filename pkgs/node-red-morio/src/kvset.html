<script type="text/javascript">
  RED.nodes.registerType('morio-kvset', {
    align: 'right',
    category: 'morio',
    color: '#ffc592',
    defaults: {
      name: { value: "" },
      key: { value: "" },
      val: { value: "" },
      apikey: { value: "", type: 'morio-apikey', required: true }
    },
    inputs: 1,
    outputs: 1,
    icon: 'morio.svg',
    label: function() {
      return this.name || `Morio KV Set: ${this.key}`;
    },
    paletteLabel: 'KV Set',
  })
</script>

<script type="text/html" data-template-name="morio-kvset">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-vcard-o"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>

  <div class="form-row">
    <label for="node-input-apikey"><i class="fa fa-key"></i> API Key</label>
    <input type="text" id="node-input-apikey">
  </div>

  <div class="form-row">
    <label for="node-input-key"><i class="fa fa-map-marker"></i> KV Key</label>
    <input type="text" id="node-input-key" placeholder="morio/ui/markdown/home">
  </div>

  <div class="form-row">
    <label for="node-input-val"><i class="fa fa-file-text-o"></i> KV Value</label>
    <input type="text" id="node-input-val" placeholder="hello_world">
  </div>
</script>

<script type="text/html" data-help-name="morio-kvset">
  <p>Creates/Updates a value from a key-value store via HTTPS POST request.</p>

  <h3>Configuration</h3>
  <dl class="message-properties">
    <dt>API Key <span class="property-type">morio-apikey</span></dt>
    <dd>The API Key configuration node to use for authentication</dd>

    <dt>Key <span class="property-type">string</span></dt>
    <dd>The key to retrieve from the store</dd>
  </dl>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>key <span class="property-type">string</span></dt>
    <dd>The key to write. You can override this by setting <code>msg.kvkey</code></dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object | string</span></dt>
    <dd>The response body from the API (parsed as JSON if possible)</dd>

    <dt>statusCode <span class="property-type">number</span></dt>
    <dd>The HTTP status code of the response</dd>

    <dt>headers <span class="property-type">object</span></dt>
    <dd>The response headers</dd>
  </dl>

  <h3>Details</h3>
  <p>Makes an API request to <code>/kv/keys/{key}</code> using Basic authentication.</p>
  <p>Supports self-signed certificates and includes proper error handling.</p>
  <p>The key can be overwritten by setting msg.kvkey</p>
  <p>The value can be overwritten by setting msg.kvval</p>
  <p>Uses a shared API Key configuration node for API key management across multiple flows.</p>
</script>
