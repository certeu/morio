<script type="text/html" data-help-name="morio-jwt">
  <p>
    Retrieves a JWT token signed by Morio that you can use for authentication to services that trust
    Morio.
  </p>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>
      An object with the following properties:
      <ul>
        <li><b>jwt</b>: The JSON Web Token itself</li>
        <li><b>bearer</b>: The token as a bearer authorization string</li>
        <li>
          <b>headers</b>: An object that you can use as HTTP request headers to use the token for
          authentication.
        </li>
      </ul>
    </dd>
  </dl>

  <h3>Details</h3>
  <p>Makes an API request to <code>/token/custom</code> over the internal Docker network.</p>
  <p>
    This allows you to grab a JWT that you can then use to authenticate to systems that trust Morio.
  </p>
  <p>
    For example, if you integrate Morio with Hashicorp Vault, you can use this to get a JWT to
    authenticate to Vault. You will still need to create a policy in Vault to control what you are
    allowed to do, but you can re-use the Morio Vault integration for the authentication part.
  </p>
  <p>The entire incoming msg will be included in the JWT.</p>
</script>
