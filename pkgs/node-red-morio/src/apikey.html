<script type="text/javascript">
  RED.nodes.registerType('morio-apikey', {
    category: 'config',
    defaults: {
      name: { value: "", required: true }
    },
    credentials: {
      apikey: { type: "text", required: true },
      apisecret: { type: "password", required: true }
    },
    label: function() {
      return this.name || "Morio API Key"
    }
  })
</script>

<script type="text/html" data-template-name="morio-apikey">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="My Morio API Key">
  </div>

  <div class="form-row">
    <label for="node-config-input-apikey"><i class="fa fa-user"></i> API Key ID</label>
    <input type="text" id="node-config-input-apikey" placeholder="your-api-key-uuid">
  </div>

  <div class="form-row">
    <label for="node-config-input-apisecret"><i class="fa fa-lock"></i> API Key Secret</label>
    <input type="password" id="node-config-input-apisecret" placeholder="your-api-key-secret">
  </div>
</script>

<script type="text/html" data-help-name="morio-apikey">
  <p>Configuration node for storing a Morio API Key.</p>

  <h3>Configuration</h3>
  <dl class="message-properties">
    <dt>Name <span class="property-type">string</span></dt>
    <dd>A descriptive name for this Morio API Key</dd>

    <dt>API Key <span class="property-type">string</span></dt>
    <dd>The API key for authentication</dd>

    <dt>API Secret <span class="property-type">string</span></dt>
    <dd>The API secret for authentication</dd>
  </dl>

  <h3>Details</h3>
  <p>This configuration node stores a Morio API Key that can be reused across multiple flows.</p>
</script>
