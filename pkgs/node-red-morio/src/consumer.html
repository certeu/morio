<script type="text/javascript">
  RED.nodes.registerType('morio-consumer', {
    align: 'left',
    category: 'morio',
    color: '#00bba7',
    defaults: {
      name: { value: 'Read Morio topic', required: false },
      broker: { value: '', required: true, type: 'morio-broker-client' },
      groupid: { value: '', required: true },
      topic: { value: '', required: true, type: 'morio-topic' },
    },
    icon: 'morio.svg',
    inputs: 0,
    outputs: 1,
    outputLabels: 'New message',
    label: function () {
      return this.name || 'Read topic'
    },
    paletteLabel: 'Read topic',
  })
</script>

<script type="text/html" data-template-name="morio-consumer">
  <div>
    <div class="form-row">
      <label for="node-input-name"><i class="fa fa-tag"></i>Name</label>
      <input type="text" id="node-input-name" placeholder="Name" />
    </div>
    <div class="form-row">
      <label for="node-input-broker"><i class="fa fa-plug"></i>Broker</label>
      <input type="text" id="node-input-broker" />
    </div>
    <div class="form-row">
      <label for="node-input-groupid"><i class="fa fa-tag"></i>Group ID</label>
      <input type="text" id="node-input-groupid" placeholder="Group ID" />
    </div>
    <div class="form-row">
      <label for="node-input-topic"><i class="fa fa-link"></i>Topic</label>
      <input type="text" id="node-input-topic" placeholder="Topic" />
    </div>
  </div>
</script>

<script type="text/html" data-help-name="morio-consumer">
  <p>A Kafka/RedPanda consumer to read data from a Morio topic.</p>

  <h3>Configuration</h3>

  <dl class="message-properties">
    <dt>Name <span class="property-type">string</span></dt>
    <dd>
      A descriptive name for this consumer.
      This is pure metadata used in the display of your flow.
      It has no impact on the functioning of this node.
    </dd>

    <dt>Broker <span class="property-type">string</span></dt>
    <dd>
      This is an instance of a Morio broker client.
      You typically can re-use the same broker client instance.
    </dd>

    <dt>Group ID <span class="property-type">string</span></dt>
    <dd>
      The <code>groupId</code> ties different consumers together in a
      high-level consumer group. This is the standard way to provide
      horizontal scaling to Kafka clients, so if you give multiple flows
      the same <code>groupId</code> they will work together to process
      messages flowing through Kafka/RedPanda.
    </dd>

    <dt>Topic <span class="property-type">string</span></dt>
    <dd>
      This is an instance of a Morio topic configuration node.
      It holds the broker topic to read from.
    </dd>
  </dl>

  <h3>Details</h3>
  <p>
    If you want to different flows to process the same
    messages, you <b>must</b> give them a different <code>groupId</code>.
  </p>
</script>
