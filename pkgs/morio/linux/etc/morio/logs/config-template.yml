http:
  enabled: false
features:
  fqdn:
    enabled: true
path:
  home: /usr/share/filebeat
  config: /etc/morio/logs
  data: /var/lib/morio/logs
  logs: /var/log/morio/logs
processors:
  - drop_fields:
      fields:
        - agent
      ignore_missing: true
filebeat:
  config:
    modules:
      enabled: true
      path: /etc/morio/logs/modules.d/*.yml
      reload:
        enabled: true
        period: 30s
    inputs:
      enabled: true
      path: /etc/morio/logs/inputs.d/*.yml
      reload:
        enabled: true
        period: 30s
output:
  kafka:
    client_id: {| MORIO_CLIENT_UUID |}
    enabled: true
    hosts: {| MORIO_BROKERS |}
    max_retries: -1
    required_acks: 1
    ssl:
      enabled: true
      certificate_authorities:
        - /etc/morio/ca.pem
      verification_mode: full
      certificate: /etc/morio/cert.pem
      key: /etc/morio/key.pem
    topic: logs
    version: 2.0.0
logging:
  level: "{|#MORIO_DEBUG|}debug{|/MORIO_DEBUG|}{|^MORIO_DEBUG|}warning{|/MORIO_DEBUG|}"
  to_files: true
  files:
    path: /var/log/morio
    name: logs
    rotateeverybytes: 10485760
    keepfiles: 5
    permissions: "0600"
    interval: 24h
    rotateonstartup: false
  metrics:
    enabled: false
  json: true

