http:
  enabled: false
features:
  fqdn:
    enabled: true
path:
  home: /var/lib/morio/auditbeat
  config: /opt/morio/etc/audit
  data: /var/lib/morio/auditbeat/data
  logs: /var/log/morio/audit
processors:
  - drop_fields:
      fields:
        - agent
      ignore_missing: true
auditbeat:
  config:
    modules:
      enabled: true
      path: /opt/morio/etc/audit/modules.d/*.yml
      reload:
        enabled: true
        period: 30s
output:
  kafka:
    client_id: {| MORIO_CLIENT_UUID |}
    enabled: true
    hosts: {|{ MORIO_BROKERS }|}
    max_retries: -1
    required_acks: 1
    ssl:
      enabled: true
      certificate_authorities:
        - /etc/morio/ca.pem
      verification_mode: full
      certificate: /etc/morio/cert.pem
      key: /etc/morio/key.pem
    topic: audit
    version: 2.0.0
logging:
  level: "{|#MORIO_DEBUG|}debug{|/MORIO_DEBUG|}{|^MORIO_DEBUG|}warning{|/MORIO_DEBUG|}"
  to_files: true
  files:
    path: /var/log/morio
    name: audit
    rotateeverybytes: 10485760
    keepfiles: 5
    permissions: "0600"
    interval: 24h
    rotateonstartup: false
  metrics:
    enabled: false
  json: true

