http:
  enabled: false
features:
  fqdn:
    enabled: true
path:
  home: /var/lib/morio/filebeat
  config: /opt/morio/etc/logs
  data: /var/lib/morio/filebeat/data
  logs: /var/log/morio/logs
processors:
  - drop_fields:
      fields:
        - agent
      ignore_missing: true
filebeat:
  config:
    modules:
      enabled: true
      path: /opt/morio/etc/logs/modules.d/*.yml
      reload:
        enabled: true
        period: 30s
    inputs:
      enabled: true
      path: /opt/morio/etc/logs/inputs.d/*.yml
      reload:
        enabled: true
        period: 30s
output:
  kafka:
    client_id: {| MORIO_CLIENT_UUID |}
    enabled: true
    hosts: {|{ MORIO_BROKERS }|}
    max_retries: -1
    required_acks: 1
    ssl:
      enabled: true
      certificate_authorities:
        - /opt/morio/etc/ca.pem
      verification_mode: full
      certificate: /opt/morio/etc/cert.pem
      key: /opt/morio/etc/key.pem
    topic: logs
    version: 2.0.0
logging:
  level: "{|#MORIO_DEBUG|}debug{|/MORIO_DEBUG|}{|^MORIO_DEBUG|}warning{|/MORIO_DEBUG|}"
  to_files: true
  files:
    path: /var/log/morio
    name: logs
    rotateeverybytes: 10485760
    keepfiles: 5
    permissions: "0600"
    interval: 24h
    rotateonstartup: false
  metrics:
    enabled: false
  json: true

