      <h1>Install a Morio Cluster Node</h1>
      <p>
        To install a
        <a href="https://morio.it/" title="Learn more about Morio at morio.it">Morio</a> Cluster Node,
        run this with <code>sudo</code> rights:
      </p>
      <pre><code>curl -fsSL https://install.morio.it/cluster/canary | bash</code></pre>
      <p>
        <span class="note canary">This uses the <code>canary</code> channel</span>
        <br />
        For more details, refer to
        <a href="https://morio.it/docs/guides/install/" title="Morio install guide"
          >the Morio install guide</a
        >.
      </p>
    </div>
    <footer>
      <a href="/cluster/canary/install.sh">download install script</a>

      <a href="/cluster/">stable channel</a>
      -
      <a href="/cluster/testing/">testing channel</a>
