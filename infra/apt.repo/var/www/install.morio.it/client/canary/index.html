<html>

  <body>
    <div id="content">
      <a href="/" title="Home"><img src="/logo.svg" /></a>
      <h1>Install a Morio Client</h1>
      <p>
        To install a
        <a href="https://morio.it/" title="Learn more about Morio at morio.it">Morio</a> client
        run this with <code>sudo</code> rights:
      </p>
      <pre><code>curl -fsSL https://install.morio.it/client/canary/ | bash</code></pre>
      <p>
        <span class="note canary">This uses the <code>canary</code> channel</span>
        <br />
        For more details, refer to
        <a href="https://morio.it/docs/guides/install/client/" title="Morio client installation guide"
          >the Morio client installation guide</a
        >.
      </p>
    </div>
    <footer>
      <a href="/client/canary/install.sh">download install script</a>
      -
      <a href="/client/stable/">stable channel</a>
      -
      <a href="/client/testing/">testing channel</a>
    </footer>
  </body>
</html>
